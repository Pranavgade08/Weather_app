<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f3f4f6; color: #1f2937; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 16px; }
        .card { width: 100%; max-width: 430px; background: #ffffff; border-radius: 14px; padding: 26px 22px; border: 1px solid #e5e7eb; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05); }
        h1 { font-size: 22px; font-weight: 700; text-align: center; color: #111827; margin-bottom: 4px; }
        .subtitle { font-size: 13px; color: #6b7280; text-align: center; margin-bottom: 18px; }
        .search-row { display: flex; gap: 8px; margin-bottom: 12px; }
        input { flex: 1; padding: 10px 14px; font-size: 14px; border: 1px solid #d1d5db; border-radius: 6px; background: #f9fafb; color: #111827; outline: none; transition: 0.2s; }
        input:focus { border-color: #4b5563; background: #ffffff; box-shadow: 0 0 0 3px rgba(107, 114, 128, 0.15); }
        button.btn-search { padding: 10px 18px; background: #374151; color: #ffffff; border: none; border-radius: 6px; font-size: 14px; font-weight: 600; cursor: pointer; transition: 0.2s; }
        button.btn-search:hover { background: #1f2937; }
        button.btn-search:disabled { background: #9ca3af; cursor: not-allowed; }
        .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; align-items: center; }
        .tags span { font-size: 12px; color: #6b7280; font-weight: 500; }
        .pill { background: #f3f4f6; border: 1px solid #e5e7eb; color: #374151; font-size: 12px; font-weight: 500; padding: 4px 9px; border-radius: 6px; cursor: pointer; transition: 0.15s; }
        .pill:hover { background: #e5e7eb; color: #111827; }
        .error { background: #fee2e2; color: #b91c1c; border: 1px solid #fecaca; padding: 10px 14px; border-radius: 6px; font-size: 13px; margin-bottom: 16px; }
        .weather-box { background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 10px; padding: 18px 16px; min-height: 180px; display: flex; flex-direction: column; justify-content: center; }
        .msg { text-align: center; color: #6b7280; font-size: 14px; }
        .main-weather { display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #e5e7eb; padding-bottom: 14px; margin-bottom: 14px; }
        .icon { font-size: 42px; margin-right: 12px; line-height: 1; }
        .city-name { font-size: 19px; font-weight: 700; color: #111827; }
        .badge { display: inline-block; background: #ffffff; border: 1px solid #d1d5db; color: #4b5563; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 4px; margin-top: 4px; }
        .temp-display { font-size: 34px; font-weight: 700; color: #111827; text-align: right; }
        .temp-unit { font-size: 18px; font-weight: 600; color: #4b5563; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .metric { background: #ffffff; border: 1px solid #e5e7eb; border-radius: 6px; padding: 10px 12px; }
        .label { font-size: 11px; color: #6b7280; display: block; margin-bottom: 2px; }
        .val { font-size: 14px; font-weight: 700; color: #111827; }
        .footer { text-align: center; margin-top: 16px; font-size: 11px; color: #9ca3af; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="card">
        <h1>🌤️ Weather App</h1>
        <p class="subtitle">Live weather forecast</p>

        <form id="search-form" class="search-row" onsubmit="return false;">
            <input type="text" id="city-input" placeholder="Search city name..." autocomplete="off" required />
            <button type="submit" id="search-btn" class="btn-search">Search</button>
        </form>

        <div class="tags">
            <span>Popular:</span>
            <button type="button" class="pill" data-city="London">London</button>
            <button type="button" class="pill" data-city="Mumbai">Mumbai</button>
            <button type="button" class="pill" data-city="Tokyo">Tokyo</button>
            <button type="button" class="pill" data-city="Paris">Paris</button>
            <button type="button" class="pill" data-city="New York">New York</button>
        </div>

        <div id="error-box" class="error hidden">
            <span id="error-message"></span>
        </div>

        <div class="weather-box" id="weather-card">
            <div id="welcome-state" class="msg">
                <p>Enter a city name above to view weather data.</p>
            </div>

            <div id="loading-state" class="msg hidden">
                <p>Loading weather...</p>
            </div>

            <div id="weather-content" class="hidden">
                <div class="main-weather">
                    <div style="display: flex; align-items: center;">
                        <span id="w-icon" class="icon">☀️</span>
                        <div>
                            <div id="w-city" class="city-name">London, GB</div>
                            <span id="w-condition" class="badge">Clear Sky</span>
                        </div>
                    </div>
                    <div class="temp-display">
                        <span id="w-temp">22</span><span class="temp-unit">°C</span>
                    </div>
                </div>

                <div class="grid">
                    <div class="metric">
                        <span class="label">🌡️ Feels Like</span>
                        <span id="w-feels" class="val">22°C</span>
                    </div>
                    <div class="metric">
                        <span class="label">💧 Humidity</span>
                        <span id="w-humidity" class="val">60%</span>
                    </div>
                    <div class="metric">
                        <span class="label">💨 Wind Speed</span>
                        <span id="w-wind" class="val">4.5 m/s</span>
                    </div>
                    <div class="metric">
                        <span class="label">📊 Min / Max</span>
                        <span id="w-minmax" class="val">18° / 25°C</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="footer">
            Powered by Weather API • Python Backend
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const searchForm = document.getElementById('search-form');
            const cityInput = document.getElementById('city-input');
            const searchBtn = document.getElementById('search-btn');
            const errorBox = document.getElementById('error-box');
            const errorMessage = document.getElementById('error-message');
            const welcomeState = document.getElementById('welcome-state');
            const loadingState = document.getElementById('loading-state');
            const weatherContent = document.getElementById('weather-content');

            const wIcon = document.getElementById('w-icon');
            const wCity = document.getElementById('w-city');
            const wCondition = document.getElementById('w-condition');
            const wTemp = document.getElementById('w-temp');
            const wFeels = document.getElementById('w-feels');
            const wHumidity = document.getElementById('w-humidity');
            const wWind = document.getElementById('w-wind');
            const wMinmax = document.getElementById('w-minmax');

            document.querySelectorAll('.pill').forEach(pill => {
                pill.addEventListener('click', () => {
                    const city = pill.getAttribute('data-city');
                    cityInput.value = city;
                    searchWeather(city);
                });
            });

            searchForm.addEventListener('submit', (e) => {
                e.preventDefault();
                const city = cityInput.value.trim();
                if (city) searchWeather(city);
            });

            async function searchWeather(city) {
                errorBox.classList.add('hidden');
                welcomeState.classList.add('hidden');
                weatherContent.classList.add('hidden');
                loadingState.classList.remove('hidden');
                searchBtn.disabled = true;

                try {
                    const res = await fetch('/api/weather?city=' + encodeURIComponent(city));
                    const data = await res.json();
                    if (!res.ok) throw new Error(data.error || 'Failed to fetch weather.');

                    wIcon.textContent = data.icon_symbol || '🌤️';
                    wCity.textContent = data.country ? `${data.city}, ${data.country}` : data.city;
                    wCondition.textContent = data.description || data.condition;
                    wTemp.textContent = Math.round(data.temperature);
                    wFeels.textContent = data.feels_like + '°C';
                    wHumidity.textContent = data.humidity + '%';
                    wWind.textContent = data.wind_speed + ' m/s';
                    wMinmax.textContent = data.temp_min + '° / ' + data.temp_max + '°C';

                    loadingState.classList.add('hidden');
                    weatherContent.classList.remove('hidden');
                } catch (err) {
                    loadingState.classList.add('hidden');
                    welcomeState.classList.remove('hidden');
                    errorMessage.textContent = err.message;
                    errorBox.classList.remove('hidden');
                } finally {
                    searchBtn.disabled = false;
                }
            }
        });
    </script>
</body>
</html>
